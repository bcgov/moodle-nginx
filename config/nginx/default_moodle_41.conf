server {
    listen 8081 default_server;
    root /var/www/html;

    index index.php;

    location /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location /robots.txt {
        log_not_found off;
        access_log off;
    }

    # --- Deny access to files that must never be served -----------------------
    # Plugins and Moodle core are git-cloned into the docroot by Moodle.Dockerfile
    # and rsynced here by migrate-build-files.sh, so .git/ exists under /var/www/html.
    # Without this, .git/HEAD, .git/index and the pack files are all fetchable, which
    # is enough for git-dumper to reconstruct the full source tree.
    # Negative lookahead keeps /.well-known/ reachable for ACME HTTP-01 challenges.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Extensions PHP will not execute, and which nginx would therefore serve as
    # cleartext source (editor leftovers, DB dumps, logs).
    location ~* \.(backup|bak|orig|rej|save|swp|swo|dist|sql|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # /info holds phpconfigcheck.php, which discloses the PHP configuration. It is run
    # from the CLI by openshift/scripts/moodle-upgrade.sh, so denying HTTP access here
    # does not affect it. "^~" outranks every regex location in nginx's matching order,
    # so this wins over "location ~ [^/]\.php" below and the request never reaches
    # php-fpm; a plain prefix match would lose to that regex and still execute.
    location ^~ /info/ {
        deny all;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php;
    }

    location ~ [^/]\.php(/|$) {
        root /var/www/html;
        fastcgi_pass             php-0:9000;

        client_max_body_size 512M;
        client_body_buffer_size 256k;
        fastcgi_split_path_info  ^(.+\.php)(/.+)$;
        fastcgi_index            index.php;
        include                  fastcgi_params;
        fastcgi_read_timeout     1200s;
        fastcgi_param   PATH_INFO       $fastcgi_path_info;
        fastcgi_param   SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
